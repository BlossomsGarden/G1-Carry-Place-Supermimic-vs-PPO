<title id="title">终点箱体到位率与训练轮次</title>
<desc id="desc">PPO 四卡、SuperMimic 单卡续训、SuperMimic 四卡，每个检查点对两个随机种子各 64 条真实物理回放打分。</desc>
<rect width="100%" height="100%" fill="#FCFDFE"/>
<text x="58" y="51" fill="#192536" font-size="27" font-weight="700">终点箱体到位率 × 训练轮次</text>
<text x="58" y="81" fill="#58657A" font-size="15">每点：随机种子 2027 + 314159，各 64 集；最后一帧，目标三维距离 ≤ 0.12 m</text>
<text x="58" y="107" fill="#58657A" font-size="14">迭代轮数不是数据集 epoch；不同训练器每轮的真实环境交互和 GPU 成本不同。</text>
